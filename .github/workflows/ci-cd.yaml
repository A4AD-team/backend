name: Build and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/a4ad

jobs:
  # Build all Go services
  build-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, post-service, profile-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          go build -o bin/${{ matrix.service }} ./cmd/...

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest \
            ${{ matrix.service }}/

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} --password-stdin
          docker push ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  # Build NestJS services
  build-nestjs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [comment-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          cd ${{ matrix.service }}
          pnpm lint

      - name: Build
        run: |
          cd ${{ matrix.service }}
          pnpm build

      - name: Test
        run: |
          cd ${{ matrix.service }}
          pnpm test

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest \
            ${{ matrix.service }}/

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} --password-stdin
          docker push ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  # Build auth-service (Java)
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          cd auth-service
          mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}-auth-service:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-auth-service:latest \
            auth-service/

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} --password-stdin
          docker push ${{ env.IMAGE_PREFIX }}-auth-service:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-auth-service:latest

  # Deploy to Kubernetes (on push to main)
  deploy:
    runs-on: ubuntu-latest
    needs: [build-go, build-nestjs, build-java]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kustomize
        uses: sysdiglabs/kustomize-action@v1

      - name: Deploy to Kubernetes
        run: |
          cd k8s
          # Update image tags
          kustomize edit set image a4ad/api-gateway=${{ env.IMAGE_PREFIX }}-api-gateway:${{ github.sha }}
          kustomize edit set image a4ad/auth-service=${{ env.IMAGE_PREFIX }}-auth-service:${{ github.sha }}
          kustomize edit set image a4ad/post-service=${{ env.IMAGE_PREFIX }}-post-service:${{ github.sha }}
          kustomize edit set image a4ad/comment-service=${{ env.IMAGE_PREFIX }}-comment-service:${{ github.sha }}
          kustomize edit set image a4ad/notification-service=${{ env.IMAGE_PREFIX }}-notification-service:${{ github.sha }}
          kustomize edit set image a4ad/profile-service=${{ env.IMAGE_PREFIX }}-profile-service:${{ github.sha }}
          
          # Apply to cluster
          kubectl apply -k overlays/prod --dry-run=client
