apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: a4ad

resources:
  - ../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: api-gateway

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-service
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: auth-service

configMapGenerator:
  - name: a4ad-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - NODE_ENV=development
