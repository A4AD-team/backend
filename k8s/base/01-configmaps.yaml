apiVersion: v1
kind: ConfigMap
metadata:
  name: a4ad-config
  namespace: a4ad
data:
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  PORT: "3000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: a4ad
data:
  POSTGRES_DB: "a4ad"
  POSTGRES_USER: "postgres"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: a4ad
data:
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: a4ad
data:
  MONGODB_DB: "comment-service"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: a4ad
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
