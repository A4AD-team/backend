apiVersion: v1
kind: Secret
metadata:
  name: a4ad-secrets
  namespace: a4ad
type: Opaque
stringData:
  # PostgreSQL - Change these in production!
  POSTGRES_PASSWORD: "postgres123"
  # RabbitMQ
  RABBITMQ_USER: "guest"
  RABBITMQ_PASS: "guest"
  # JWT - MUST be changed in production!
  JWT_SECRET: "change-this-in-production-super-secret-jwt-key"
  ACCESS_SECRET: "change-this-in-production-access-token-secret"
  REFRESH_SECRET: "change-this-in-production-refresh-token-secret"
  # Redis
  REDIS_PASSWORD: ""
