name: a4ad-backend

services:
  # Infrastructure
  postgres:
    image: postgres:16
    container_name: a4ad-postgres
    networks:
      - a4ad-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-a4ad}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    container_name: a4ad-mongodb
    networks:
      - a4ad-network
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: a4ad-redis
    networks:
      - a4ad-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: a4ad-rabbitmq
    networks:
      - a4ad-network
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Services
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: a4ad-auth-service
    ports:
      - "8081:8080"
    env_file:
      - ./auth-service/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-a4ad}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres123}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - a4ad-network

  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    container_name: a4ad-post-service
    ports:
      - "8083:8083"
    env_file:
      - ./post-service/.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-a4ad}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - a4ad-network

  comment-service:
    build:
      context: ./comment-service
      dockerfile: Dockerfile
    container_name: a4ad-comment-service
    ports:
      - "3000:3000"
    env_file:
      - ./comment-service/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/${MONGODB_DB:-comment-service}
      - REDIS_HOST=redis
      - RABBITMQ_URI=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - a4ad-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: a4ad-api-gateway
    ports:
      - "8080:8080"
    env_file:
      - ./api-gateway/.env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - AUTH_SERVICE_URL=http://auth-service:8080
      - POST_SERVICE_URL=http://post-service:8083
      - COMMENT_SERVICE_URL=http://comment-service:3000
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      post-service:
        condition: service_started
      comment-service:
        condition: service_started
    networks:
      - a4ad-network

networks:
  a4ad-network:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
  rabbitmq-data:
